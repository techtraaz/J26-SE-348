  Requirement:
    - {id: "CF:4.38#R1", type: recognition, obligation: should, text: "Recognise an item meeting an element definition when future benefit is probable and cost or value can be measured reliably"}
    - {id: "LKAS 1:10#R1", type: presentation, obligation: shall, text: "Present SFP, SPLOCI, SCE, SCF, notes and comparative information as a complete set"}
    - {id: "LKAS 1:15#R1", type: presentation, obligation: shall, text: "Financial statements present fairly financial position, performance and cash flows"}
    - {id: "LKAS 1:25#R1", type: disclosure, obligation: shall, text: "Assess going concern and disclose material uncertainties or a non going concern basis"}
    - {id: "LKAS 1:27#R1", type: recognition, obligation: shall, text: "Prepare financial statements on the accrual basis except cash flow information"}
    - {id: "LKAS 1:29#R1", type: presentation, obligation: shall, text: "Present each material class of similar items separately"}
    - {id: "LKAS 1:32#R1", type: presentation, obligation: shall, text: "Do not offset assets and liabilities or income and expenses unless an SLFRS requires or permits"}
    - {id: "LKAS 1:38#R1", type: presentation, obligation: shall, text: "Present comparative information for the preceding period for all amounts reported"}
    - {id: "LKAS 1:54#R1", type: presentation, obligation: shall, text: "SFP includes minimum line items such as PPE, inventories, receivables, cash, payables, provisions, tax and equity"}
    - {id: "LKAS 1:60#R1", type: classification, obligation: shall, text: "Present current and non-current assets and liabilities separately unless a liquidity presentation is more relevant"}
    - {id: "LKAS 1:66#R1", type: classification, obligation: shall, text: "Classify an asset as current when realised in the operating cycle, held for trading, realised within twelve months or is unrestricted cash"}
    - {id: "LKAS 1:69#R1", type: classification, obligation: shall, text: "Classify a liability as current when settled in the operating cycle, held for trading, due within twelve months or settlement cannot be deferred"}
    - {id: "LKAS 1:81A#R1", type: presentation, obligation: shall, text: "Present profit or loss, total other comprehensive income and total comprehensive income"}
    - {id: "LKAS 1:82#R1", type: presentation, obligation: shall, text: "Profit or loss includes revenue, finance costs, share of associates, tax expense and discontinued operations"}
    - {id: "LKAS 1:87#R1", type: presentation, obligation: shall, text: "Do not present any item of income or expense as extraordinary"}
    - {id: "LKAS 1:99#R1", type: presentation, obligation: shall, text: "Analyse expenses by nature or by function"}
    - {id: "LKAS 1:106#R1", type: presentation, obligation: shall, text: "SCE shows total comprehensive income, restatements and a reconciliation of each equity component"}
    - {id: "LKAS 1:117#R1", type: disclosure, obligation: shall, text: "Disclose significant accounting policies including measurement bases"}
    - {id: "LKAS 2:9#R1", type: measurement, obligation: shall, text: "Measure inventories at the lower of cost and net realisable value"}
    - {id: "LKAS 2:10#R1", type: measurement, obligation: shall, text: "Cost of inventories includes purchase, conversion and other costs to bring them to present location and condition"}
    - {id: "LKAS 2:25#R1", type: measurement, obligation: shall, text: "Assign cost using FIFO or weighted average for interchangeable items"}
    - {id: "LKAS 2:34#R1", type: recognition, obligation: shall, text: "Expense the carrying amount of inventories sold in the period revenue is recognised, and expense write-downs to NRV"}
    - {id: "LKAS 2:36#R1", type: disclosure, obligation: shall, text: "Disclose inventory policies, carrying amounts, amounts expensed, write-downs and inventories pledged"}
    - {id: "LKAS 7:10#R1", type: presentation, obligation: shall, text: "Classify cash flows into operating, investing and financing activities"}
    - {id: "LKAS 7:18#R1", type: presentation, obligation: shall, text: "Report operating cash flows using the direct or indirect method"}
    - {id: "LKAS 7:31#R1", type: disclosure, obligation: shall, text: "Disclose interest and dividends received and paid separately and classify them consistently"}
    - {id: "LKAS 7:35#R1", type: classification, obligation: shall, text: "Disclose taxes on income separately and classify them as operating unless linked to investing or financing"}
    - {id: "LKAS 7:43#R1", type: presentation, obligation: shall, text: "Exclude non-cash investing and financing transactions from the cash flow statement"}
    - {id: "LKAS 7:45#R1", type: disclosure, obligation: shall, text: "Disclose components of cash and cash equivalents and reconcile them to the SFP"}
    - {id: "LKAS 8:11#R1", type: measurement, obligation: shall, text: "Without a specific SLFRS, refer first to SLFRSs on similar issues, then to the Conceptual Framework"}
    - {id: "LKAS 8:14#R1", type: measurement, obligation: shall, text: "Change an accounting policy only if an SLFRS requires it or it gives more relevant information"}
    - {id: "LKAS 8:36#R1", type: measurement, obligation: shall, text: "Recognise changes in accounting estimates prospectively in profit or loss"}
    - {id: "LKAS 8:42#R1", type: measurement, obligation: shall, text: "Correct material prior period errors retrospectively by restating comparatives or opening balances"}
    - {id: "LKAS 8:49#R1", type: disclosure, obligation: shall, text: "Disclose the nature and amount of prior period error corrections"}
    - {id: "LKAS 10:8#R1", type: measurement, obligation: shall, text: "Adjust amounts for adjusting events after the reporting period"}
    - {id: "LKAS 10:10#R1", type: measurement, obligation: shall, text: "Do not adjust amounts for non-adjusting events after the reporting period"}
    - {id: "LKAS 10:12#R1", type: recognition, obligation: shall, text: "Dividends declared after the reporting period are not a liability at period end"}
    - {id: "LKAS 10:14#R1", type: measurement, obligation: shall, text: "Do not use the going concern basis if management decides after period end to liquidate or stop trading"}
    - {id: "LKAS 10:17#R1", type: disclosure, obligation: shall, text: "Disclose the date the financial statements were authorised for issue and who authorised them"}
    - {id: "LKAS 10:21#R1", type: disclosure, obligation: shall, text: "Disclose the nature and estimated effect of material non-adjusting events"}

  Definition:
    - {id: "DEF:asset", term: Asset, text: "Resource controlled by the entity from past events with expected future economic benefits"}
    - {id: "DEF:liability", term: Liability, text: "Present obligation from past events expected to cause an outflow of economic benefits"}
    - {id: "DEF:equity", term: Equity, text: "Residual interest in assets after deducting all liabilities"}
    - {id: "DEF:income", term: Income, text: "Increases in economic benefits that increase equity, other than owner contributions"}
    - {id: "DEF:expenses", term: Expenses, text: "Decreases in economic benefits that decrease equity, other than owner distributions"}
    - {id: "DEF:going_concern", term: Going concern, text: "Assumption the entity will continue operating for the foreseeable future"}
    - {id: "DEF:material", term: Material, text: "Omission or misstatement that could influence users' economic decisions, judged by size and nature"}
    - {id: "DEF:profit_or_loss", term: Profit or loss, text: "Total of income less expenses, excluding other comprehensive income"}
    - {id: "DEF:oci", term: Other comprehensive income, text: "Income and expense items not recognised in profit or loss as required or permitted by SLFRSs"}
    - {id: "DEF:tci", term: Total comprehensive income, text: "Change in equity in a period other than from transactions with owners"}
    - {id: "DEF:inventories", term: Inventories, text: "Assets held for sale, in production for sale, or materials and supplies used in production or services"}
    - {id: "DEF:nrv", term: Net realisable value, text: "Estimated selling price less estimated costs of completion and costs to sell"}
    - {id: "DEF:cash", term: Cash, text: "Cash on hand and demand deposits"}
    - {id: "DEF:cash_equivalents", term: Cash equivalents, text: "Short-term highly liquid investments readily convertible to known cash with insignificant risk of value change"}
    - {id: "DEF:operating_activities", term: Operating activities, text: "Principal revenue-producing activities and other activities not investing or financing"}
    - {id: "DEF:investing_activities", term: Investing activities, text: "Acquisition and disposal of long-term assets and investments not in cash equivalents"}
    - {id: "DEF:financing_activities", term: Financing activities, text: "Activities changing the size and composition of contributed equity and borrowings"}
    - {id: "DEF:accounting_policies", term: Accounting policies, text: "Specific principles, bases, conventions, rules and practices used to prepare financial statements"}
    - {id: "DEF:change_in_estimate", term: Change in accounting estimate, text: "Adjustment of a carrying amount from new information about assets and liabilities, not an error correction"}
    - {id: "DEF:prior_period_error", term: Prior period errors, text: "Omissions or misstatements in prior periods from failing to use reliable information, including fraud"}
    - {id: "DEF:adjusting_event", term: Adjusting event after the reporting period, text: "Event giving evidence of conditions that existed at the end of the reporting period"}
    - {id: "DEF:non_adjusting_event", term: Non-adjusting event after the reporting period, text: "Event indicating conditions that arose after the reporting period"}

  Amendment:
    - {id: "AMD:LKAS1-OCI-2014", title: Presentation of Items of Other Comprehensive Income (Amendments to LKAS 1), issued: 2014-01-01, effective_from: 2014-01-01}
    - {id: "AMD:LKAS1-DI-2015", title: Disclosure Initiative (Amendments to LKAS 1), issued: 2015-03-01, effective_from: 2016-01-01}
    - {id: "AMD:LKAS7-DI-2016", title: Disclosure Initiative (Amendments to LKAS 7), issued: 2016-09-01, effective_from: 2017-01-01}

