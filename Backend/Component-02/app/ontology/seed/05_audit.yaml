# Audit layer: SLAuS references, assertions, procedures, risks, document types and check rules.
# CHK-001 to CHK-006 and POL-07 match Component 03 (rule_engine.py, mock_data.json).
nodes:
  Standard:
    - {code: SLAuS 240, title: "The Auditor's Responsibilities Relating to Fraud in an Audit of Financial Statements", family: SLAuS, authority: 1, status: active}
    - {code: SLAuS 315, title: "Identifying and Assessing the Risks of Material Misstatement", family: SLAuS, authority: 1, status: active}
    - {code: SLAuS 320, title: "Materiality in Planning and Performing an Audit", family: SLAuS, authority: 1, status: active}
    - {code: SLAuS 500, title: "Audit Evidence", family: SLAuS, authority: 1, status: active}
    - {code: SLAuS 505, title: "External Confirmations", family: SLAuS, authority: 1, status: active}
    - {code: SLAuS 520, title: "Analytical Procedures", family: SLAuS, authority: 1, status: active}
    - {code: SLAuS 560, title: "Subsequent Events", family: SLAuS, authority: 1, status: active}
    - {code: SLAuS 570, title: "Going Concern", family: SLAuS, authority: 1, status: active}

  AuditAssertion:
    - {code: OCCURRENCE, name: Occurrence, category: transactions}
    - {code: COMPLETENESS, name: Completeness, category: all}
    - {code: ACCURACY, name: Accuracy, category: transactions}
    - {code: CUTOFF, name: Cut-off, category: transactions}
    - {code: CLASSIFICATION, name: Classification, category: all}
    - {code: PRESENTATION, name: Presentation, category: all}
    - {code: EXISTENCE, name: Existence, category: balances}
    - {code: RIGHTS_OBLIGATIONS, name: Rights and obligations, category: balances}
    - {code: VALUATION, name: "Accuracy, valuation and allocation", category: balances}

  AuditProcedure:
    - {code: INSPECTION, name: Inspection of records or documents, type: test_of_details}
    - {code: OBSERVATION, name: Observation, type: test_of_details}
    - {code: EXTERNAL_CONFIRMATION, name: External confirmation, type: test_of_details}
    - {code: RECALCULATION, name: Recalculation, type: test_of_details}
    - {code: REPERFORMANCE, name: Reperformance, type: test_of_controls}
    - {code: ANALYTICAL, name: Analytical procedures, type: analytical}
    - {code: INQUIRY, name: Inquiry, type: test_of_details}

  Risk:
    - {code: ERROR_MISSTATEMENT, name: Material misstatement due to error, type: error}
    - {code: FRAUD_MISSTATEMENT, name: Material misstatement due to fraud, type: fraud}
    - {code: REVENUE_FRAUD, name: Fraud in revenue recognition, type: fraud}
    - {code: MANAGEMENT_OVERRIDE, name: Management override of controls, type: fraud}
    - {code: GOING_CONCERN, name: Going concern uncertainty, type: going_concern}
    - {code: SUBSEQUENT_EVENTS, name: Unrecorded events after the reporting period, type: error}

  DocumentType:
    - {code: balance_sheet, name: Statement of financial position}
    - {code: income_statement, name: Statement of profit or loss}
    - {code: cash_flow_statement, name: Statement of cash flows}
    - {code: equity_statement, name: Statement of changes in equity}
    - {code: trial_balance, name: Trial balance}
    - {code: general_ledger, name: General ledger}
    - {code: invoice, name: Sales or purchase invoice}
    - {code: receipt, name: Receipt}
    - {code: payment_voucher, name: Payment voucher}
    - {code: bank_statement, name: Bank statement}
    - {code: purchase_order, name: Purchase order}
    - {code: goods_received_note, name: Goods received note}
    - {code: fixed_asset_register, name: Fixed asset register}
    - {code: payroll, name: Payroll records}

  CheckRule:
    - {rule_id: CHK-001, name: Accounting equation, expression: "assets == liabilities + capital", severity: high}
    - {rule_id: CHK-002, name: Debit equals credit, expression: "debit_total == credit_total", severity: high}
    - {rule_id: CHK-003, name: Child amount matches parent, expression: "child.amount == parent.amount", severity: high}
    - {rule_id: CHK-004, name: Year on year change within limit, expression: "abs(assets - prior.assets) / abs(prior.assets) <= 0.30", severity: medium}
    - {rule_id: CHK-005, name: Cash out without asset in, expression: "not (cash_out > 0 and purchase_basis == 'credit' and asset_in == 0)", severity: high}
    - {rule_id: CHK-006, name: Required fields present, expression: "required fields present and confidence >= 0.5", severity: medium}
    - {rule_id: CHK-007, name: Total assets equals current plus non-current, expression: "total_assets == total_current_assets + total_non_current_assets", severity: medium}
    - {rule_id: CHK-008, name: Gross profit, expression: "gross_profit == revenue - cost_of_sales", severity: medium}
    - {rule_id: CHK-009, name: Cash flow closing cash ties to SFP, expression: "closing_cash == cash_and_cash_equivalents", severity: high}
    - {rule_id: CHK-010, name: Closing equity ties to SFP, expression: "closing_equity == total_equity", severity: high}
    - {rule_id: CHK-011, name: Inventory not above NRV, expression: "inventories <= inventory_nrv", severity: medium}

  PolicyRule:
    - {rule_id: POL-07, text: "Purchases above Rs. 100,000 need dual approval.", limit: 100000.0}

