# Financial statements, line items, equations (LKAS 1, 2, 7 and the Conceptual Framework)
nodes:
  FinancialStatement:
    - {code: SFP, name: "Statement of financial position"}
    - {code: SPLOCI, name: "Statement of profit or loss and other comprehensive income"}
    - {code: SCE, name: "Statement of changes in equity"}
    - {code: SCF, name: "Statement of cash flows"}
    - {code: NOTES, name: "Notes to the financial statements"}
  AccountClass:
    - {code: ASSET, name: "Asset", normal_balance: debit}
    - {code: CURRENT_ASSET, name: "Current asset", normal_balance: debit}
    - {code: NON_CURRENT_ASSET, name: "Non-current asset", normal_balance: debit}
    - {code: LIABILITY, name: "Liability", normal_balance: credit}
    - {code: CURRENT_LIABILITY, name: "Current liability", normal_balance: credit}
    - {code: NON_CURRENT_LIABILITY, name: "Non-current liability", normal_balance: credit}
    - {code: EQUITY, name: "Equity", normal_balance: credit}
    - {code: INCOME, name: "Income", normal_balance: credit}
    - {code: EXPENSE, name: "Expense", normal_balance: debit}
  LineItem:
    - {code: ppe, name: "Property, plant and equipment"}
    - {code: investment_property, name: "Investment property"}
    - {code: intangible_assets, name: "Intangible assets"}
    - {code: financial_assets, name: "Financial assets"}
    - {code: equity_accounted_investments, name: "Investments accounted for using the equity method"}
    - {code: biological_assets, name: "Biological assets"}
    - {code: deferred_tax_assets, name: "Deferred tax assets"}
    - {code: total_non_current_assets, name: "Total non-current assets"}
    - {code: inventories, name: "Inventories", aliases: [inventory, closing_inventory]}
    - {code: trade_receivables, name: "Trade and other receivables", aliases: [receivables]}
    - {code: current_tax_assets, name: "Current tax assets"}
    - {code: cash_and_cash_equivalents, name: "Cash and cash equivalents", aliases: [cash]}
    - {code: assets_held_for_sale, name: "Assets held for sale"}
    - {code: total_current_assets, name: "Total current assets", aliases: [current_assets]}
    - {code: total_assets, name: "Total assets", aliases: [assets]}
    - {code: share_capital, name: "Stated capital", aliases: [stated_capital]}
    - {code: reserves, name: "Reserves"}
    - {code: retained_earnings, name: "Retained earnings"}
    - {code: non_controlling_interests, name: "Non-controlling interests"}
    - {code: total_equity, name: "Total equity", aliases: [capital, equity]}
    - {code: financial_liabilities, name: "Interest-bearing borrowings", aliases: [borrowings]}
    - {code: deferred_tax_liabilities, name: "Deferred tax liabilities"}
    - {code: total_non_current_liabilities, name: "Total non-current liabilities"}
    - {code: trade_payables, name: "Trade and other payables", aliases: [payables]}
    - {code: provisions, name: "Provisions"}
    - {code: current_tax_liabilities, name: "Current tax liabilities"}
    - {code: liabilities_held_for_sale, name: "Liabilities held for sale"}
    - {code: total_current_liabilities, name: "Total current liabilities", aliases: [current_liabilities]}
    - {code: total_liabilities, name: "Total liabilities", aliases: [liabilities]}
    - {code: revenue, name: "Revenue", aliases: [sales, turnover]}
    - {code: cost_of_sales, name: "Cost of sales", aliases: [cogs]}
    - {code: gross_profit, name: "Gross profit"}
    - {code: other_income, name: "Other income"}
    - {code: distribution_costs, name: "Distribution costs"}
    - {code: administrative_expenses, name: "Administrative expenses"}
    - {code: other_expenses, name: "Other expenses"}
    - {code: finance_costs, name: "Finance costs"}
    - {code: share_of_associates_profit, name: "Share of profit of associates and joint ventures"}
    - {code: profit_before_tax, name: "Profit before tax", aliases: [pbt]}
    - {code: tax_expense, name: "Income tax expense"}
    - {code: discontinued_operations, name: "Profit or loss from discontinued operations"}
    - {code: profit_for_the_year, name: "Profit for the year", aliases: [net_profit, profit]}
    - {code: other_comprehensive_income, name: "Other comprehensive income", aliases: [oci]}
    - {code: total_comprehensive_income, name: "Total comprehensive income", aliases: [tci]}
    - {code: opening_equity, name: "Equity at beginning of period"}
    - {code: restatements, name: "Effect of retrospective application or restatement"}
    - {code: sce_total_comprehensive_income, name: "Total comprehensive income for the period"}
    - {code: owner_contributions, name: "Contributions by owners", aliases: [share_issue]}
    - {code: dividends, name: "Dividends"}
    - {code: closing_equity, name: "Equity at end of period"}
    - {code: opening_retained_earnings, name: "Retained earnings at beginning of period"}
    - {code: net_cash_operating, name: "Net cash from operating activities", aliases: [cfo]}
    - {code: net_cash_investing, name: "Net cash used in investing activities", aliases: [cfi]}
    - {code: net_cash_financing, name: "Net cash from financing activities", aliases: [cff]}
    - {code: net_change_in_cash, name: "Net increase or decrease in cash and cash equivalents"}
    - {code: opening_cash, name: "Cash and cash equivalents at beginning of period"}
    - {code: fx_effect_on_cash, name: "Effect of exchange rate changes on cash"}
    - {code: closing_cash, name: "Cash and cash equivalents at end of period"}
    - {code: opening_inventories, name: "Inventories at beginning of period", aliases: [opening_inventory]}
    - {code: purchases, name: "Purchases"}
    - {code: inventory_cost, name: "Inventories at cost"}
    - {code: inventory_nrv, name: "Inventories at net realisable value"}
    - {code: estimated_selling_price, name: "Estimated selling price"}
    - {code: costs_to_complete, name: "Estimated costs of completion"}
    - {code: costs_to_sell, name: "Estimated costs to make the sale"}
    - {code: total_debits, name: "Total debits", aliases: [debit_total]}
    - {code: total_credits, name: "Total credits", aliases: [credit_total]}
  MeasurementBasis:
    - {code: HISTORICAL_COST, name: "Historical cost"}
    - {code: CURRENT_COST, name: "Current cost"}
    - {code: REALISABLE_VALUE, name: "Realisable (settlement) value"}
    - {code: PRESENT_VALUE, name: "Present value"}
    - {code: NRV, name: "Net realisable value"}
    - {code: FAIR_VALUE, name: "Fair value"}
  QualitativeCharacteristic:
    - {code: RELEVANCE, name: "Relevance", type: fundamental}
    - {code: FAITHFUL_REPRESENTATION, name: "Faithful representation", type: fundamental}
    - {code: COMPARABILITY, name: "Comparability", type: enhancing}
    - {code: VERIFIABILITY, name: "Verifiability", type: enhancing}
    - {code: TIMELINESS, name: "Timeliness", type: enhancing}
    - {code: UNDERSTANDABILITY, name: "Understandability", type: enhancing}
  Equation:
    - {code: EQ-001, name: "Accounting equation", expression: "total_assets == total_liabilities + total_equity", kind: within_statement}
    - {code: EQ-002, name: "Total assets", expression: "total_assets == total_current_assets + total_non_current_assets", kind: within_statement}
    - {code: EQ-003, name: "Total liabilities", expression: "total_liabilities == total_current_liabilities + total_non_current_liabilities", kind: within_statement}
    - {code: EQ-004, name: "Total equity", expression: "total_equity == share_capital + reserves + retained_earnings + non_controlling_interests", kind: within_statement}
    - {code: EQ-005, name: "Gross profit", expression: "gross_profit == revenue - cost_of_sales", kind: within_statement}
    - {code: EQ-006, name: "Profit before tax", expression: "profit_before_tax == gross_profit + other_income - distribution_costs - administrative_expenses - other_expenses - finance_costs + share_of_associates_profit", kind: within_statement}
    - {code: EQ-007, name: "Profit for the year", expression: "profit_for_the_year == profit_before_tax - tax_expense + discontinued_operations", kind: within_statement}
    - {code: EQ-008, name: "Total comprehensive income", expression: "total_comprehensive_income == profit_for_the_year + other_comprehensive_income", kind: within_statement}
    - {code: EQ-009, name: "Cost of sales", expression: "cost_of_sales == opening_inventories + purchases - inventories", kind: within_statement}
    - {code: EQ-010, name: "Equity reconciliation", expression: "closing_equity == opening_equity + restatements + sce_total_comprehensive_income + owner_contributions - dividends", kind: within_statement}
    - {code: EQ-011, name: "Retained earnings reconciliation", expression: "retained_earnings == opening_retained_earnings + profit_for_the_year - dividends", kind: within_statement}
    - {code: EQ-012, name: "Net change in cash", expression: "net_change_in_cash == net_cash_operating + net_cash_investing + net_cash_financing", kind: within_statement}
    - {code: EQ-013, name: "Closing cash", expression: "closing_cash == opening_cash + net_change_in_cash + fx_effect_on_cash", kind: within_statement}
    - {code: EQ-014, name: "Cash ties to statement of financial position", expression: "closing_cash == cash_and_cash_equivalents", kind: cross_statement}
    - {code: EQ-015, name: "Equity ties to statement of financial position", expression: "closing_equity == total_equity", kind: cross_statement}
    - {code: EQ-016, name: "Comprehensive income ties to statement of changes in equity", expression: "sce_total_comprehensive_income == total_comprehensive_income", kind: cross_statement}
    - {code: EQ-017, name: "Inventory at lower of cost and NRV", expression: "inventories == min(inventory_cost, inventory_nrv)", kind: measurement}
    - {code: EQ-018, name: "Net realisable value", expression: "inventory_nrv == estimated_selling_price - costs_to_complete - costs_to_sell", kind: measurement}
    - {code: EQ-019, name: "Debits equal credits", expression: "total_debits == total_credits", kind: bookkeeping}
  Ratio:
    - {code: RAT-001, name: "Current ratio", expression: "total_current_assets / total_current_liabilities"}
    - {code: RAT-002, name: "Quick ratio", expression: "(total_current_assets - inventories) / total_current_liabilities"}
    - {code: RAT-003, name: "Gross margin", expression: "gross_profit / revenue"}
    - {code: RAT-004, name: "Net profit margin", expression: "profit_for_the_year / revenue"}
    - {code: RAT-005, name: "Debt to equity", expression: "total_liabilities / total_equity"}
    - {code: RAT-006, name: "Inventory turnover", expression: "cost_of_sales / inventories"}

