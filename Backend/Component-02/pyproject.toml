[project]
name = "nomos-component-02"
version = "0.1.0"
description = "Sri Lankan audit knowledge graph, KG query API and evidence ledger (Component 02)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.0",
    "pydantic-settings>=2.4",
    "neo4j>=5.25",
    "pyyaml>=6.0",
    "pypdf[crypto]>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
