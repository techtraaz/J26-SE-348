[project]
name = "nomos-component-03"
version = "0.1.0"
description = "Multi-agent audit reasoning layer and Audit Copilot (Component 03)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "pydantic>=2.0",
    "ollama>=0.4",
    "langgraph>=0.6",
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
