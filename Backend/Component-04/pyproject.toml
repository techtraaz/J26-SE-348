[project]
name = "nomos-component-04"
version = "0.2.0"
description = "XAI Trace Collector & Deterministic Reporting Engine (Component 04)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28",
    "pymongo>=4.0",
    "pydantic>=2.0",
    "sse-starlette>=2.0",
    "reportlab>=4.2",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mongomock>=4.1",
    "moto[s3]>=5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
