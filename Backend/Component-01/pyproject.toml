[project]
name = "nomos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rushxdev", email = "rashmikapabasara@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
]

[project.scripts]
nomos = "nomos:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
